<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CASTLE performance — Jincheng Xiong</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #17212b; background: #fff;

    a { color: #1772d0; }
    h1 { margin: 18px 0 6px; font-size: 24px; }
    p { margin: 0 0 24px; color: #697784; }

  <main>
    <a href="../index.html#projects-title">← Back to homepage</a>

    <div class="charts">
      <figure>
        <figcaption>Training time</figcaption>
        <a href="assets/castle-performance.png" aria-label="Open the original training time chart">

      </figure>
      <figure>
